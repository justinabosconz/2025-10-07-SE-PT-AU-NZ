<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 6</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>Exercise 6!!</h1>

    <template id="card-template">
      <div class="card col-8" style="width: 18rem; margin: 10px">
        <div class="card-body">
          <h5 class="card-title">Card title</h5>
          <p class="card-text">Card text.</p>
        </div>
      </div>
    </template>

    <div id="card-list" class="row"></div>
  </body>
  <script>
    fetch("https://jsonplaceholder.typicode.com/posts?_limit=10")
      .then((response) => response.json())
      .then((json) => json.forEach((item) => addCard(item.title, item.body)));

    function addCard(cardTitle, cardDescription) {
      const template = document
        .getElementById("card-template")
        .content.cloneNode(true);
      template.querySelector(".card-title").innerText = cardTitle;
      template.querySelector(".card-text").innerText = cardDescription;
      document.querySelector("#card-list").appendChild(template);
    }
  </script>
</html>
