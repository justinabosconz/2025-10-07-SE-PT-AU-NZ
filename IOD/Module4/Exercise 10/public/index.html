<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce Website</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h3 class="text-center text-light bg-info">
      Module 4 - Ecommerce Website!!
    </h3>

    <!-- Dropdown -->
    <select onchange="" id="categories">
      <option value="show all categories">Show all Categories</option>
      <option value="men's clothing">Men's Clothing</option>
      <option value="women's clothing">Women's Clothing</option>
      <option value="jewelery">Jewelery</option>
      <option value="electronics">Electronics</option>
    </select>

    <!-- card template -->
    <template id="card-template">
      <div
        class="card col-lg-3 col-md-6 col-sm-12"
        style="width: 18rem; margin: 2rem"
      >
        <div class="card-body overflow-auto">
          <div class="card-heading text-info"></div>
          <div class="card-picture"></div>
          <div class="card-price bg-info w-100"></div>
          <div class="card-category font-weight-bold"></div>
          <div class="card-description" style="height: 300px"></div>
        </div>
      </div>
    </template>

    <!-- div container -->
    <div class="container">
      <div id="card-list" class="row"></div>
    </div>
  </body>
</html>
