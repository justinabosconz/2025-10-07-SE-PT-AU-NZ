<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce Website</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Bootstrap Example</title>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
  </head>
  <body>
    <h3 class="text-center text-light bg-info">
      Module 4 - Ecommerce Website!!
    </h3>

    <!-- Dropdown -->
    <select onchange="" id="categories">
      <option value="show all categories">Show all Categories</option>
      <option value="men's clothing">Men's Clothing</option>
      <option value="women's clothing">Women's Clothing</option>
      <option value="jewelery">Jewelery</option>
      <option value="electronics">Electronics</option>
    </select>

    <!-- card template -->
    <template id="card-template">
      <div
        class="card col-lg-3 col-md-6 col-sm-12"
        style="width: 18rem; margin: 2rem"
      >
        <div class="card-body overflow-auto">
          <div class="card-heading text-info"></div>
          <div class="card-picture"></div>
          <div class="card-price bg-info w-100"></div>
          <div class="card-category font-weight-bold"></div>
          <div class="card-description" style="height: 300px"></div>
        </div>
      </div>
    </template>

    <!-- div container -->
    <div class="container">
      <div id="card-list" class="row"></div>
    </div>

    <!-- script -->
    <script>
      let allProducts = []; // Store data globally to filter without re-fetching

      // 1. Fetch data and store it
      fetch("https://fakestoreapi.com/products")
        .then((response) => response.json())
        .then((json) => {
          allProducts = json;
          renderCards(allProducts); // Initial render
        });

      // 2. Add event listener to the dropdown
      document.getElementById("categories").addEventListener("change", (e) => {
        const selectedCategory = e.target.value.toLowerCase();

        // Filter logic
        const filteredProducts =
          selectedCategory === "show all categories"
            ? allProducts
            : allProducts.filter(
                (product) => product.category === selectedCategory
              );

        renderCards(filteredProducts);
      });

      // 3. Function to clear and rebuild the list
      function renderCards(products) {
        const list = document.getElementById("card-list");
        list.innerHTML = ""; // Clear existing cards

        products.forEach((item) => {
          addCard(
            item.title,
            item.image,
            item.price,
            item.category,
            item.description
          );
        });
      }

      function addCard(
        cardTitle,
        cardPicture,
        cardPrice,
        cardCategory,
        cardDescription
      ) {
        const template = document
          .getElementById("card-template")
          .content.cloneNode(true);
        template.querySelector(".card-heading").innerText = cardTitle;
        template.querySelector(
          ".card-picture"
        ).innerHTML = `<img src="${cardPicture}" class="px-2" alt="product" width="100" height="100" />`;
        template.querySelector(".card-price").innerText = "$" + cardPrice;
        template.querySelector(".card-category").innerText =
          cardCategory.toUpperCase();
        template.querySelector(".card-description").innerText = cardDescription;
        document.querySelector("#card-list").appendChild(template);
      }
    </script>
  </body>
</html>
