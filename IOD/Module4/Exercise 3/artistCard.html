<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 3.3 - Artist Cards</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #e3f2fd;
      }
      .card {
        padding: 10px;
        border: solid black 2px;
        width: 25vw;
      }
      .card-title {
        font-weight: 600;
        font-size: 3em;
        padding: 0 0 10px 0;
      }
      .card-description {
        font-weight: 400;
        font-size: 2em;
      }
    </style>
  </head>
  <body>
    <template id="card-template">
      <div class="card">
        <div class="card-body">
          <div class="card-heading"></div>
          <div class="card-picture"></div>
        </div>
      </div>
    </template>
    <div id="card-list"></div>
  </body>
  <script>
    const artist = {
      name: "Van Gogh",
      portfolio: [
        {
          title: "portrait",
          url: "https://collectionapi.metmuseum.org/api/collection/v1/iiif/436532/1671316/main-image",
        },

        {
          title: "sky",
          url: "https://mymodernmet.com/wp/wp-content/uploads/2020/11/White-house-night-van-goh-worldwide-2.jpg",
        },
      ],
    };

    function addCard(cardHeading, cardPicture) {
      const template = document
        .getElementById("card-template")
        .content.cloneNode(true);
      template.querySelector(".card-heading").innerText =
        `This paiting of Artist ${artist.name} is called ` + cardHeading;
      template.querySelector(
        ".card-picture"
      ).innerHTML = `<img src=${cardPicture} alt="artist" width="100" height="100" />`;
      document.querySelector("#card-list").appendChild(template);
    }
    artist.portfolio.forEach((item) => {
      addCard(item.title, item.url);
    });
  </script>
</html>
