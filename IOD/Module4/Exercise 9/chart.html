<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eCharts</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.1/dist/echarts.min.js"></script>
  </head>
  <body>
    <!-- Prepare a DOM with a defined width and height for ECharts -->
    <div id="chart" style="width: 900px; height: 600px"></div>

    <script type="text/javascript">
      // Specify the configuration items and data for the chart
      let options = {
        title: { text: "Fake Store Categories" },
        xAxis: {
          data: [],
        },
        yAxis: {},
        series: [
          {
            name: "# products",
            type: "bar",
            data: [],
          },
        ],
      };

      fetch("https://fakestoreapi.com/products")
        .then((response) => response.json())
        .then((json) => {
          let fetchedData = json.reduce((acc, cur) => {
            acc[cur.category] = (acc[cur.category] || 0) + 1;
            return acc;
          }, {});
          for (let key in fetchedData) {
            options.xAxis.data.push(key);
            options.series[0].data.push(fetchedData[key]);
          }
          // use this JSON to find and set correct option data for the chart
        })
        .then(() => {
          // Display the chart
          myChart.setOption(options);
        });
      // Initialize the echarts instance based on the prepared div
      let myChart = echarts.init(document.getElementById("chart"));
    </script>
  </body>
</html>
