<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator Web Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Exercise 2</h1>

    <select class="bigger" id="selection">
      <option value="add">Add</option>
      <option value="subtract">Subtract</option>
      <option value="divide">Divide</option>
      <option value="multiply">Multiply</option>
    </select>

    <div class="m1">
      <label for="num1">Enter Number 1</label>
      <input type="text" name="num1" id="num1" />
    </div>

    <div class="m1">
      <label for="num2">Enter Number 2</label>
      <input type="text" name="num2" id="num2" />
    </div>

    <div class="m1">
      <label for="">Result</label>
      <label id="result"></label>
    </div>

    <div class="m2">
      <button onclick="calculate()">Calculate</button>
    </div>
  </body>
  <script>
    function calculate() {
      let num1 = document.getElementById("num1").value;
      let num2 = document.getElementById("num2").value;
      let calculatingSign = document.getElementById("selection").value;

      fetch(
        `http://127.0.0.1:3000/Calculate/${calculatingSign}?num1=${num1}&num2=${num2}`
      )
        .then((response) => response.json())
        .then(
          (json) => (document.getElementById("result").innerText = json.res)
        );
    }
  </script>
</html>
